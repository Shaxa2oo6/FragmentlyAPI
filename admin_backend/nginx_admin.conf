# ==============================================================================
# FRAGMENTLY ADMIN PANEL & BACKEND — NGINX XAVFSIZLIK VA REVERSE PROXY SOZLAMALARI
# ==============================================================================

server {
    listen 80;
    server_name admin.fragmently.uz;

    # HTTPS yo'naltirish
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.fragmently.uz;

    # SSL sertifikat yo'llari (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/admin.fragmently.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.fragmently.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --------------------------------------------------------------------------
    # HTTP Security Headers (Xavfsizlik Sarlavhalari)
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Max so'rov hajmi (Platform hamyon / export fayllar uchun)
    client_max_body_size 10M;

    # --------------------------------------------------------------------------
    # Frontend SPA (Admin Panel Vite Dist)
    # --------------------------------------------------------------------------
    location / {
        root /var/www/fragmently_admin/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Backend API Proxy (FastAPI admin_backend: port 8001)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
