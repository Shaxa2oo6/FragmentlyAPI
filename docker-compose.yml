version: '3.8'

# Sozlamalar environment o'zgaruvchilari orqali boshqariladi.
# Nusxalash uchun: cp .env.example .env (root), keyin kerakli qiymatlarni to'ldiring.
# Xavfsizlik: productionda POSTGRES_PASSWORD va SECRET_KEY ni albatta o'zgartiring!

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fragmently}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fragmently_password}
      POSTGRES_DB: ${POSTGRES_DB:-fragmently}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fragmently}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fragmently}:${POSTGRES_PASSWORD:-fragmently_password}@postgres:5432/${POSTGRES_DB:-fragmently}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: